[package]
name = "dma-heap-probe-rs"
version = "0.1.0"
edition = "2024"
description = "Comprehensive DMA-Heap userspace test tool for Android 16+ (kernel 6.12+)"
license = "MIT"
repository = "https://github.com/zekaizer/dma-heap-probe-rs"

[[bin]]
name = "dhp"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["fs", "mman", "ioctl"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
