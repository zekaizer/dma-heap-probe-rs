[package]
name = "dma-heap-probe-rs"
version = "2.2.0"
edition = "2024"
description = "Comprehensive DMA-Heap userspace test tool for Android 16+ (kernel 6.12+)"
license = "MIT"
repository = "https://github.com/zekaizer/dma-heap-probe-rs"

[[bin]]
name = "dhp"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31", features = ["fs", "mman", "ioctl"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
rand = "0.9"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
