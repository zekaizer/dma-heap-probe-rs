[package]
name = "dma-heap-probe-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dhp"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["fs", "mman", "ioctl"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
